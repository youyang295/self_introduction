<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>拼图华容道 · 孙路遥的小游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />
<style>
:root {
  --brand-1: #6366f1;
  --brand-2: #22d3ee;
  --brand-3: #f472b6;
  --bg: #070711;
  --surface: rgba(255,255,255,.045);
  --surface-2: rgba(255,255,255,.075);
  --border: rgba(255,255,255,.10);
  --text: #f2f3fa;
  --text-dim: #a8acc6;
  --text-faint: #6f7391;
  --radius: 20px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --font-cn: "Noto Sans SC", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
  --font-en: "Outfit", var(--font-cn);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-cn);
  background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.7;
  overflow-x: hidden;
  display: flex; flex-direction: column; align-items: center;
  padding: 0 20px;
  -webkit-tap-highlight-color: transparent;
}
.blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .45; z-index: -1; pointer-events: none; }
.b1 { width: 44vw; height: 44vw; background: var(--brand-1); top: -16vw; left: -12vw; }
.b2 { width: 34vw; height: 34vw; background: var(--brand-2); bottom: -16vw; right: -10vw; }

.wrap { width: 100%; max-width: 560px; margin: 0 auto; }
.back { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; color: var(--text-dim); text-decoration: none; padding: 24px 0 8px; }
.back:hover { color: var(--text); }

.head { padding: 12px 0 18px; }
h1 { font-size: clamp(28px, 6.5vw, 40px); font-weight: 900; letter-spacing: -.03em; line-height: 1.15; }
.grad {
  background: linear-gradient(100deg, var(--brand-1), var(--brand-2) 50%, var(--brand-3));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.sub { color: var(--text-dim); font-size: 14.5px; margin-top: 6px; }

/* 统计栏 */
.stats { display: flex; gap: 10px; margin-bottom: 16px; }
.stat {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 8px 10px; text-align: center;
}
.stat b { display: block; font-family: var(--font-en); font-size: 20px; font-weight: 800; line-height: 1.25; }
.stat span { font-size: 11.5px; color: var(--text-faint); letter-spacing: .06em; }

/* 难度切换 */
.levels { display: flex; gap: 8px; margin-bottom: 16px; }
.levels button {
  flex: 1; font-family: inherit; font-size: 14px; font-weight: 600;
  color: var(--text-dim); background: var(--surface);
  border: 1px solid var(--border); border-radius: 100px;
  padding: 9px 4px; cursor: pointer;
  transition: transform .2s var(--ease), background .2s, color .2s, border-color .2s;
}
.levels button:hover { transform: translateY(-2px); background: var(--surface-2); color: var(--text); }
.levels button.on {
  background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
  border-color: transparent; color: #fff;
}

/* 棋盘 */
.board-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; }
canvas {
  width: 100%; height: 100%; display: block;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: rgba(255,255,255,.03);
  touch-action: none;
}

.tools { display: flex; gap: 10px; padding: 16px 0 6px; }
button.act {
  font-family: inherit; font-size: 14.5px; font-weight: 600;
  color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 100px;
  padding: 10px 22px; cursor: pointer; flex: 1;
  transition: transform .2s var(--ease), background .2s, border-color .2s;
}
button.act:hover { transform: translateY(-2px); background: var(--surface-2); border-color: rgba(255,255,255,.24); }
button.act.primary { background: linear-gradient(120deg, var(--brand-1), var(--brand-2)); border-color: transparent; color: #fff; }
button.act.on { background: rgba(34,211,238,.18); border-color: rgba(34,211,238,.5); color: var(--brand-2); }

.hint { text-align: center; color: var(--text-faint); font-size: 13.5px; padding: 14px 0 4px; }
.diag {
  display: none; margin: 10px 0 0; padding: 12px 16px;
  border-radius: 12px; font-size: 13px; line-height: 1.65; border: 1px solid;
}
.diag.ok { border-color: rgba(34,211,238,.35); background: rgba(34,211,238,.08); color: var(--brand-2); }
.diag.bad { border-color: rgba(244,114,182,.45); background: rgba(244,114,182,.10); color: #ffd9ec; }

/* 完成遮罩 */
.overlay {
  position: absolute; inset: 0; border-radius: var(--radius);
  background: rgba(7,7,17,.88);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: grid; place-items: center; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .35s var(--ease);
}
.overlay.show { opacity: 1; pointer-events: auto; }
.overlay h2 { font-size: clamp(24px, 6vw, 32px); font-weight: 900; margin-bottom: 8px; }
.overlay p { color: var(--text-dim); font-size: 14.5px; margin-bottom: 20px; }
.overlay button {
  font-family: inherit; font-size: 15px; font-weight: 600; color: #fff;
  background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
  border: none; border-radius: 100px; padding: 12px 28px; cursor: pointer;
}

footer { margin-top: auto; padding: 34px 0; font-size: 13px; color: var(--text-faint); text-align: center; }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="wrap">
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    返回小游戏合集
  </a>

  <div class="head">
    <h1>拼图<span class="grad">华容道</span></h1>
    <p class="sub">点空格旁边的方块把它滑过去，把打乱的校徽拼回原样。</p>
  </div>

  <div class="stats">
    <div class="stat"><b id="moves">0</b><span>步数</span></div>
    <div class="stat"><b id="time">00:00</b><span>用时</span></div>
    <div class="stat"><b id="best">--</b><span>最佳步数</span></div>
  </div>

  <div class="levels" id="levels">
    <button data-n="3" class="on">3 × 3</button>
    <button data-n="4">4 × 4</button>
    <button data-n="5">5 × 5</button>
  </div>

  <div class="board-wrap">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <div>
        <h2 id="ovTitle">拼好了！</h2>
        <p id="ovText"></p>
        <button id="ovBtn">再来一局</button>
      </div>
    </div>
  </div>

  <div class="tools">
    <button class="act primary" id="restart">重新打乱</button>
    <button class="act" id="peek">查看原图</button>
  </div>

  <div class="hint">方向键也能玩：按方向键把方块滑进空格</div>
  <div class="diag" id="diag"></div>
</div>

<footer class="wrap">单个 HTML 文件实现，底图是海南大学校徽。</footer>

<script>
(function () {
  'use strict';

  /* ============================================================
     拼图华容道 —— 实现思路
     ------------------------------------------------------------
     ① 状态：一个长度 N*N 的数组。board[i] = 方块编号(0..N*N-2)，
        最后一个位置是 null，代表那个空格。
        开局时 board[i] === i 就是拼好的状态。
     ② 判定能否移动：方块和空格的行列差之和必须等于 1（即相邻）。
     ③ 洗牌不用「随机打乱」——那样可能拼不回来。
        而是从拼好的状态开始反复随机滑动，滑出来的局面必定可解。
     ④ 每次移动后检查 board[i] === i 是否对所有 i 成立，成立即通关。
     ⑤ 渲染：Canvas 每帧把底图按方块编号裁出对应的一块画上去，
        再给每块加一点立体阴影，看起来才像实体木块。
     ============================================================ */

  var SIZE = 600;               // 画布内部分辨率
  var PAD = 10;                 // 棋盘内边距
  var GAP = 6;                  // 方块间距
  var RAD = 12;                 // 圆角

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var movesEl = document.getElementById('moves');
  var timeEl = document.getElementById('time');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovBtn = document.getElementById('ovBtn');
  var diagEl = document.getElementById('diag');
  var levelsEl = document.getElementById('levels');
  var peekBtn = document.getElementById('peek');

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = SIZE * dpr;
  canvas.height = SIZE * dpr;
  ctx.scale(dpr, dpr);

  var N = 3;                    // 默认 3x3
  var board = [];               // 当前排列
  var moves = 0;
  var startTime = 0;
  var seconds = 0;
  var running = false;
  var solvedFlag = false;
  var peek = false;             // 是否显示原图参考
  var anim = null;              // 正在滑动的方块 { from, to, t0 }

  /* ---------- 底图加载 ---------- */
  var photo = null;             // 离屏画布，装 600x600 的校徽
  var photoReady = false;

  (function loadPhoto() {
    var im = new Image();
    var settled = false;
    im.onload = function () {
      if (settled) return;
      settled = true;
      try {
        var off = document.createElement('canvas');
        off.width = 600; off.height = 600;
        var og = off.getContext('2d');
        og.imageSmoothingEnabled = true;
        og.imageSmoothingQuality = 'high';
        og.drawImage(im, 0, 0, 600, 600);
        photo = off;
        photoReady = true;
        diagEl.className = 'diag ok';
        diagEl.style.display = 'block';
        diagEl.textContent = '底图已加载：' + (im.naturalWidth || im.width) + ' × ' + (im.naturalHeight || im.height);
        draw();
      } catch (e) {
        fail('底图绘制失败：' + e.message);
      }
    };
    im.onerror = function () { if (!settled) { settled = true; fail('底图加载失败，请确认 photos/logo.jpg 存在'); } };
    setTimeout(function () { if (!settled) { settled = true; fail('底图 3 秒内无响应'); } }, 3000);
    im.src = 'photos/logo.jpg';
  })();

  function fail(msg) {
    diagEl.className = 'diag bad';
    diagEl.style.display = 'block';
    diagEl.textContent = msg;
    draw();   // 没底图也要把方块和编号画出来，至少能玩
  }

  /* ---------- 布局计算 ---------- */
  function metrics() {
    var cell = (SIZE - PAD * 2 - GAP * (N - 1)) / N;
    return { cell: cell };
  }
  function tilePos(idx) {
    var m = metrics();
    var r = Math.floor(idx / N), c = idx % N;
    return { x: PAD + c * (m.cell + GAP), y: PAD + r * (m.cell + GAP), s: m.cell };
  }

  /* ---------- 游戏逻辑 ---------- */

  function blankIndex() {
    for (var i = 0; i < board.length; i++) if (board[i] === null) return i;
    return -1;
  }

  // 方块编号 v 的「正确位置」就是 v 本身
  function isSolved() {
    for (var i = 0; i < board.length - 1; i++) if (board[i] !== i) return false;
    return board[board.length - 1] === null;
  }

  // 两个格子是否相邻（行列差之和为 1）
  function adjacent(a, b) {
    var ar = Math.floor(a / N), ac = a % N;
    var br = Math.floor(b / N), bc = b % N;
    return Math.abs(ar - br) + Math.abs(ac - bc) === 1;
  }

  // 把 idx 位置的方块滑进空格
  function slide(idx, countMove) {
    var b = blankIndex();
    if (b < 0 || !adjacent(idx, b)) return false;
    board[b] = board[idx];
    board[idx] = null;
    if (countMove !== false) {
      moves++;
      movesEl.textContent = moves;
      if (!running && !solvedFlag) startTimer();
    }
    anim = { from: b, to: idx, t0: performance.now() };
    scheduleDraw();
    checkWin();
    return true;
  }

  function checkWin() {
    if (!isSolved()) return;
    solvedFlag = true;
    running = false;
    var t = timeEl.textContent;
    saveBest();
    setTimeout(function () {
      ovTitle.textContent = '拼好了！';
      ovText.textContent = '用了 ' + moves + ' 步、' + t +
        (isBestNow() ? '，刷新了你的最佳纪录 🎉' : '。');
      ovBtn.textContent = '再来一局';
      overlay.classList.add('show');
    }, 320);
  }

  /* ---------- 洗牌 ----------
     从拼好的状态出发，反复随机滑动。
     这样得到的局面「一定能拼回来」——
     如果直接用 Math.random 打乱数组，有一半概率是无解的死局。 */
  function scramble(times) {
    var b = blankIndex();
    var last = -1;
    for (var i = 0; i < times; i++) {
      var bIdx = blankIndex();
      var br = Math.floor(bIdx / N), bc = bIdx % N;
      var opts = [];
      if (br > 0) opts.push(bIdx - N);
      if (br < N - 1) opts.push(bIdx + N);
      if (bc > 0) opts.push(bIdx - 1);
      if (bc < N - 1) opts.push(bIdx + 1);
      // 避免原路返回，那样等于白滑
      opts = opts.filter(function (o) { return o !== last; });
      var pick = opts[Math.floor(Math.random() * opts.length)];
      board[bIdx] = board[pick];
      board[pick] = null;
      last = bIdx;
    }
    solvedFlag = false;
    moves = 0;
    movesEl.textContent = '0';
    seconds = 0;
    running = false;
    timeEl.textContent = '00:00';
    clearInterval(timerId);
    timerId = null;
    overlay.classList.remove('show');
    showBest();
    anim = null;
    draw();
  }

  /* ---------- 计时 ---------- */
  var timerId = null;
  function startTimer() {
    if (timerId) return;
    running = true;
    startTime = Date.now() - seconds * 1000;
    timerId = setInterval(function () {
      seconds = Math.floor((Date.now() - startTime) / 1000);
      timeEl.textContent = fmt(seconds);
    }, 250);
  }
  function fmt(s) {
    var m = Math.floor(s / 60), ss = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
  }
  function stopTimer() { clearInterval(timerId); timerId = null; running = false; }

  /* ---------- 最佳成绩（按难度分别记录） ---------- */
  function bestKey() { return 'puzzle_best_' + N; }
  function readBest() {
    try { return parseInt(localStorage.getItem(bestKey()), 10) || 0; } catch (e) { return 0; }
  }
  function showBest() {
    var b = readBest();
    bestEl.textContent = b ? b + ' 步' : '--';
  }
  function isBestNow() {
    var b = readBest();
    return !b || moves < b;
  }
  function saveBest() {
    var b = readBest();
    if (!b || moves < b) {
      try { localStorage.setItem(bestKey(), String(moves)); } catch (e) {}
    }
    showBest();
  }

  /* ---------- 渲染 ---------- */

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  var drawing = false;
  function scheduleDraw() {
    if (drawing) return;
    drawing = true;
    requestAnimationFrame(function () {
      drawing = false;
      draw();
    });
  }

  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    // ① 空底座：整块棋盘铺一层暗色，空格处就靠它显出来
    ctx.fillStyle = 'rgba(255,255,255,.035)';
    roundRect(ctx, PAD, PAD, SIZE - PAD * 2, SIZE - PAD * 2, RAD);
    ctx.fill();

    // ② 查看原图模式：把底图淡淡地铺在底下当参考
    if (peek && photo) {
      ctx.save();
      ctx.globalAlpha = 0.22;
      roundRect(ctx, PAD, PAD, SIZE - PAD * 2, SIZE - PAD * 2, RAD);
      ctx.clip();
      ctx.drawImage(photo, PAD, PAD, SIZE - PAD * 2, SIZE - PAD * 2);
      ctx.restore();
    }

    // ③ 算出每个方块的绘制位置（含滑动过渡）
    var t = 1;
    if (anim) {
      t = Math.min((performance.now() - anim.t0) / 130, 1);
      if (t >= 1) anim = null;
    }
    var et = 1 - Math.pow(1 - t, 3);   // easeOutCubic

    for (var i = 0; i < board.length; i++) {
      var v = board[i];
      if (v === null) continue;

      var to = tilePos(i);
      var x = to.x, y = to.y;

      // 正在滑动的那一块：从它原来的位置滑过来
      if (anim && anim.to === i) {
        var from = tilePos(anim.from);
        x = from.x + (to.x - from.x) * et;
        y = from.y + (to.y - from.y) * et;
      }

      drawPiece(v, x, y, to.s);
    }

    if (anim) scheduleDraw();
  }

  // 画一块拼图：底图裁出第 v 块 + 立体阴影 + 左上角编号
  function drawPiece(v, x, y, s) {
    var srcS = 600 / N;                  // 底图里每块的边长
    var srcX = (v % N) * srcS;
    var srcY = Math.floor(v / N) * srcS;

    // 阴影：让方块看起来是凸起的实体
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#12142a';
    roundRect(ctx, x, y, s, s, RAD);
    ctx.fill();
    ctx.restore();

    // 底图切片
    ctx.save();
    roundRect(ctx, x, y, s, s, RAD);
    ctx.clip();
    if (photo) {
      ctx.drawImage(photo, srcX, srcY, srcS, srcS, x, y, s, s);
      // 轻微提亮，深色主题下不至于发黑
      ctx.fillStyle = 'rgba(255,255,255,.06)';
      ctx.fillRect(x, y, s, s);
    } else {
      // 底图没加载出来时用渐变色，保证还能玩
      var g = ctx.createLinearGradient(x, y, x + s, y + s);
      g.addColorStop(0, '#6366f1');
      g.addColorStop(1, '#22d3ee');
      ctx.fillStyle = g;
      ctx.fillRect(x, y, s, s);
    }
    ctx.restore();

    // 描边
    ctx.strokeStyle = 'rgba(255,255,255,.14)';
    ctx.lineWidth = 1;
    roundRect(ctx, x + .5, y + .5, s - 1, s - 1, RAD);
    ctx.stroke();

    // 左上角编号：方便你确认哪块该去哪
    var fpx = Math.max(9, Math.round(s * 0.20));
    var label = String(v + 1);
    ctx.font = '800 ' + fpx + 'px Outfit, system-ui, sans-serif';
    var tw = ctx.measureText(label).width;
    var padX = Math.round(fpx * 0.28), padY = Math.round(fpx * 0.16);
    var bw = tw + padX * 2, bh = fpx + padY * 2;
    var bx = x + 6, by = y + 6;

    ctx.fillStyle = 'rgba(8,10,22,.72)';
    roundRect(ctx, bx, by, bw, bh, Math.min(bh / 2, 12));
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, bx + bw / 2, by + bh / 2 + fpx * 0.04);
  }

  /* ---------- 交互 ---------- */

  // 点方块：换算成格子下标
  function onClick(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    var px = (clientX - r.left) / r.width * SIZE;
    var py = (clientY - r.top) / r.height * SIZE;
    if (px < PAD || py < PAD) return;
    var m = metrics();
    var c = Math.floor((px - PAD) / (m.cell + GAP));
    var rw = Math.floor((py - PAD) / (m.cell + GAP));
    if (c < 0 || c >= N || rw < 0 || rw >= N) return;
    // 落在间隙上就不响应
    var inX = px - PAD - c * (m.cell + GAP);
    var inY = py - PAD - rw * (m.cell + GAP);
    if (inX > m.cell || inY > m.cell) return;
    slide(rw * N + c);
  }

  canvas.addEventListener('click', function (e) { onClick(e.clientX, e.clientY); });

  canvas.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0];
    onClick(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });

  // 方向键：按「方块往哪滑」来理解
  //   ↑ 把空格下面的方块往上推，↓ 把空格上面的方块往下推，依此类推
  window.addEventListener('keydown', function (e) {
    var b = blankIndex();
    if (b < 0) return;
    var r = Math.floor(b / N), c = b % N;
    var target = -1;
    if (e.key === 'ArrowUp' && r < N - 1) target = b + N;        // 下方的方块上移
    else if (e.key === 'ArrowDown' && r > 0) target = b - N;      // 上方的方块下移
    else if (e.key === 'ArrowLeft' && c < N - 1) target = b + 1;  // 右方的方块左移
    else if (e.key === 'ArrowRight' && c > 0) target = b - 1;     // 左方的方块右移
    else return;
    e.preventDefault();
    slide(target);
  });

  document.getElementById('restart').addEventListener('click', function () {
    scramble(N * N * 12);
  });

  peekBtn.addEventListener('click', function () {
    peek = !peek;
    peekBtn.classList.toggle('on', peek);
    peekBtn.textContent = peek ? '隐藏原图' : '查看原图';
    draw();
  });

  ovBtn.addEventListener('click', function () {
    overlay.classList.remove('show');
    scramble(N * N * 12);
  });

  levelsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var n = parseInt(btn.getAttribute('data-n'), 10);
    if (n === N) return;
    Array.prototype.forEach.call(levelsEl.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b === btn);
    });
    N = n;
    newGame();
  });

  /* ---------- 开局 ---------- */

  function newGame() {
    stopTimer();
    board = [];
    for (var i = 0; i < N * N - 1; i++) board.push(i);
    board.push(null);                 // 最后一格是空格
    solvedFlag = false;
    peek = false;
    peekBtn.classList.remove('on');
    peekBtn.textContent = '查看原图';
    anim = null;
    showBest();
    scramble(N * N * 12);
  }

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    // 尊重系统的「减少动态效果」：滑动瞬间完成
  }

  newGame();
})();
</script>
</body>
</html>
