<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>合成海大 · 孙路遥的小游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />
<style>
:root {
  --brand-1: #6366f1;
  --brand-2: #22d3ee;
  --brand-3: #f472b6;
  --bg: #070711;
  --surface: rgba(255,255,255,.045);
  --surface-2: rgba(255,255,255,.075);
  --border: rgba(255,255,255,.10);
  --text: #f2f3fa;
  --text-dim: #a8acc6;
  --text-faint: #6f7391;
  --radius: 20px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --font-cn: "Noto Sans SC", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
  --font-en: "Outfit", var(--font-cn);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-cn);
  background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.7;
  overflow-x: hidden;
  display: flex; flex-direction: column; align-items: center;
  padding: 0 20px;
  -webkit-tap-highlight-color: transparent;
}
.blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .45; z-index: -1; pointer-events: none; }
.b1 { width: 44vw; height: 44vw; background: var(--brand-1); top: -16vw; left: -12vw; }
.b2 { width: 34vw; height: 34vw; background: var(--brand-3); bottom: -16vw; right: -10vw; }

.wrap { width: 100%; max-width: 580px; margin: 0 auto; }
.back { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; color: var(--text-dim); text-decoration: none; padding: 22px 0 6px; }
.back:hover { color: var(--text); }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 10px 0 14px; }
h1 { font-size: clamp(26px, 6vw, 38px); font-weight: 900; letter-spacing: -.03em; line-height: 1.15; }
.grad {
  background: linear-gradient(100deg, var(--brand-1), var(--brand-2) 50%, var(--brand-3));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.scores { display: flex; gap: 10px; flex: none; }
.score { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 7px 16px; text-align: center; min-width: 82px; }
.score b { display: block; font-family: var(--font-en); font-size: 20px; font-weight: 800; line-height: 1.25; }
.score span { font-size: 11.5px; color: var(--text-faint); letter-spacing: .06em; }

/* 进度条：八个级别，当前能合成的下一个会用亮色高亮 */
.levels { display: flex; gap: 4px; margin-bottom: 12px; }
.levels div {
  flex: 1; height: 6px; border-radius: 100px;
  background: rgba(255,255,255,.08); overflow: hidden; position: relative;
}
.levels div i { position: absolute; inset: 0; opacity: .9; border-radius: 100px; transition: opacity .3s; }

.board-wrap { position: relative; width: 100%; }
canvas {
  width: 100%; height: auto; display: block;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: rgba(255,255,255,.025);
  touch-action: none; cursor: pointer;
}

.tools { display: flex; gap: 10px; padding: 14px 0 6px; }
button.act {
  font-family: inherit; font-size: 14.5px; font-weight: 600;
  color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 100px;
  padding: 10px 22px; cursor: pointer; flex: 1;
  transition: transform .2s var(--ease), background .2s, border-color .2s;
}
button.act:hover { transform: translateY(-2px); background: var(--surface-2); border-color: rgba(255,255,255,.24); }
button.act.primary { background: linear-gradient(120deg, var(--brand-1), var(--brand-2)); border-color: transparent; color: #fff; }

.hint { text-align: center; color: var(--text-faint); font-size: 13.5px; padding: 12px 0 4px; }
.diag {
  display: none; margin: 10px 0 0; padding: 12px 16px;
  border-radius: 12px; font-size: 13px; line-height: 1.65; border: 1px solid;
}
.diag.ok { border-color: rgba(34,211,238,.35); background: rgba(34,211,238,.08); color: var(--brand-2); }
.diag.bad { border-color: rgba(244,114,182,.45); background: rgba(244,114,182,.10); color: #ffd9ec; }

.overlay {
  position: absolute; inset: 0; border-radius: var(--radius);
  background: rgba(7,7,17,.88);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: grid; place-items: center; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .35s var(--ease);
}
.overlay.show { opacity: 1; pointer-events: auto; }
.overlay h2 { font-size: clamp(24px, 6vw, 32px); font-weight: 900; margin-bottom: 8px; }
.overlay p { color: var(--text-dim); font-size: 14.5px; margin-bottom: 20px; }
.overlay button {
  font-family: inherit; font-size: 15px; font-weight: 600; color: #fff;
  background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
  border: none; border-radius: 100px; padding: 12px 28px; cursor: pointer;
}

footer { margin-top: auto; padding: 32px 0; font-size: 13px; color: var(--text-faint); text-align: center; }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="wrap">
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    返回小游戏合集
  </a>

  <div class="head">
    <h1>合成<span class="grad">海大</span></h1>
    <div class="scores">
      <div class="score"><b id="score">0</b><span>得分</span></div>
      <div class="score"><b id="best">0</b><span>最高分</span></div>
    </div>
  </div>

  <div class="levels" id="levels"></div>

  <div class="board-wrap">
    <canvas id="board" width="520" height="680"></canvas>
    <div class="overlay" id="overlay">
      <div>
        <h2 id="ovTitle">游戏结束</h2>
        <p id="ovText"></p>
        <button id="ovBtn">再来一局</button>
      </div>
    </div>
  </div>

  <div class="hints-row">
    <div class="hint">移动鼠标（或手指）选位置，点击投放。两个同级碰在一起就合成更大的</div>
  </div>

  <div class="tools">
    <button class="act primary" id="restart">重新开始</button>
  </div>

  <div class="diag" id="diag"></div>
</div>

<footer class="wrap">单个 HTML 文件实现，物理引擎也是手写的，不依赖任何外部库。</footer>

<script>
/* ============================================================
   合成大西瓜（海大版）
   ------------------------------------------------------------
   玩法：点画面投放校园照片球，两个相同级别的球碰到一起
         就会合成一个更高级别的球。八张照片 = 八个级别，
         合出最高级的那张就算通关。

   实现分两层：
     ① 物理层：圆与圆的重叠检测、位置修正、冲量、边界约束
     ② 游戏层：级别配置、投放、合并、计分、结束判定
   ============================================================ */
(function () {
  'use strict';

  /* ==================== 级别配置 ====================
     八张校园照对应八个级别，半径从小到大。

     半径整体放大约 35% 来提高难度，但必须满足一个硬约束：
       L7 球要能「两个并排放下」，否则两个 L7 永远无法同时存在，
       也就永远合不出 L8 —— 通关条件不可达。
       L7 半径上限 = 画布宽 520 / 4 = 130，所以取 125 留点余量。

     难度数据（画布 520×680，危险线 130，安全高度 550px）：
       L1 直径 60px  → 横向并排 8 个（原来 11 个）
       安全高度只够堆 9.2 层 L1（原来 12.5 层）
       L8 直径 300px → 占画布宽度 58% */
  var LEVELS = [
    { r: 30,  photo: 'photos/tile1.jpg', name: '图书馆' },
    { r: 41,  photo: 'photos/tile2.jpg', name: '钟楼' },
    { r: 54,  photo: 'photos/tile3.jpg', name: '园林' },
    { r: 70,  photo: 'photos/tile4.jpg', name: '教学楼' },
    { r: 89,  photo: 'photos/tile5.jpg', name: '彩虹' },
    { r: 101, photo: 'photos/tile6.jpg', name: '三角梅' },
    { r: 125, photo: 'photos/tile7.jpg', name: '校门' },
    { r: 150, photo: 'photos/tile8.jpg', name: '思源亭' }
  ];
  var MAX_LEVEL = LEVELS.length;
  // 每个级别一个颜色，用于进度条和球体外圈
  var COLORS = ['#6366f1', '#8b5cf6', '#0ea5e9', '#10b981', '#a3e635', '#f59e0b', '#f472b6', '#ef4444'];

  var W = 520, H = 680;
  var GRAVITY = 0.62;
  var DROP_Y = 54;             // 待投放球的球心高度
  var DEAD_LINE = 130;         // 越过这条线并停留超时就算结束
  var MAX_OVER_TIME = 90;      // 连续 90 帧（约 1.5 秒）越线就结束

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovBtn = document.getElementById('ovBtn');
  var levelsEl = document.getElementById('levels');
  var diagEl = document.getElementById('diag');

  /* ==================== 物理引擎（内联） ====================
     和 physics.js 是同一套逻辑。合并进单个文件是为了让你
     双击打开也能玩，不会因为缺少外部文件而失效。              */
  var Phys = (function () {
    var BOUNCE = 0.85;
    var FRICTION = 0.12;

    function vec(x, y) { return { x: x, y: y }; }

    function resolve(a, b) {
      var dx = b.pos.x - a.pos.x, dy = b.pos.y - a.pos.y;
      var d2 = dx * dx + dy * dy;
      var rsum = a.radius + b.radius;
      if (d2 >= rsum * rsum || d2 === 0) return;

      var d = Math.sqrt(d2);
      var nx = dx / d, ny = dy / d;

      // 位置修正：按质量比把两球推开
      var overlap = (rsum - d) * 1.02;
      var ma = a.radius * a.radius, mb = b.radius * b.radius;
      var total = ma + mb;
      a.pos.x -= nx * overlap * (mb / total);
      a.pos.y -= ny * overlap * (mb / total);
      b.pos.x += nx * overlap * (ma / total);
      b.pos.y += ny * overlap * (ma / total);

      // 冲量
      var rvx = b.vel.x - a.vel.x, rvy = b.vel.y - a.vel.y;
      var vn = rvx * nx + rvy * ny;
      if (vn > 0) return;
      var j = -(1 + BOUNCE) * vn / (1 / ma + 1 / mb);
      a.vel.x -= (j / ma) * nx; a.vel.y -= (j / ma) * ny;
      b.vel.x += (j / mb) * nx; b.vel.y += (j / mb) * ny;

      // 切向摩擦
      var tx = -ny, ty = nx;
      var vt = rvx * tx + rvy * ty;
      a.vel.x += (vt * FRICTION / 2) * tx; a.vel.y += (vt * FRICTION / 2) * ty;
      b.vel.x -= (vt * FRICTION / 2) * tx; b.vel.y -= (vt * FRICTION / 2) * ty;
    }

    function step(balls, opts) {
      var iters = opts.iterations || 5;

      // ① 积分 + 墙壁约束
      for (var i = 0; i < balls.length; i++) {
        var b = balls[i];
        if (b.dead) continue;
        b.vel.y += opts.gravity;
        b.pos.x += b.vel.x;
        b.pos.y += b.vel.y;

        if (b.pos.x - b.radius < opts.left) { b.pos.x = opts.left + b.radius; b.vel.x = -b.vel.x * 0.4; }
        else if (b.pos.x + b.radius > opts.right) { b.pos.x = opts.right - b.radius; b.vel.x = -b.vel.x * 0.4; }
        if (b.pos.y + b.radius > opts.bottom) {
          b.pos.y = opts.bottom - b.radius;
          b.vel.y = -b.vel.y * 0.25;
          b.vel.x *= 0.88;
        }
      }

      // ② 碰撞 + 合并
      for (var it = 0; it < iters; it++) {
        for (var a = 0; a < balls.length; a++) {
          var A = balls[a];
          if (A.dead) continue;
          for (var c = a + 1; c < balls.length; c++) {
            var B = balls[c];
            if (B.dead) continue;
            if (A.level === B.level && A.level < MAX_LEVEL && it === 0 && opts.onMerge &&
                hitTest(A, B) && opts.onMerge(A, B)) {
              A.dead = true; B.dead = true; break;
            }
            resolve(A, B);
          }
        }
      }

      // ③ 再夹一次边界（位置修正可能把球推出墙外）
      for (var c2 = 0; c2 < balls.length; c2++) {
        var bc = balls[c2];
        if (bc.dead) continue;
        if (bc.pos.x - bc.radius < opts.left) bc.pos.x = opts.left + bc.radius;
        if (bc.pos.x + bc.radius > opts.right) bc.pos.x = opts.right - bc.radius;
        if (bc.pos.y + bc.radius > opts.bottom) {
          bc.pos.y = opts.bottom - bc.radius;
          if (bc.vel.y > 0) bc.vel.y = 0;
        }
      }

      // ④ 阻尼
      for (var k = 0; k < balls.length; k++) {
        var bb = balls[k];
        if (bb.dead) continue;
        bb.vel.x *= 0.995;
        bb.vel.y *= 0.999;
        if (Math.abs(bb.vel.x) < 0.02) bb.vel.x = 0;
        if (Math.abs(bb.vel.y) < 0.02) bb.vel.y = 0;
      }
    }

    function hitTest(A, B) {
      var dx = B.pos.x - A.pos.x, dy = B.pos.y - A.pos.y;
      var rsum = A.radius + B.radius;
      return dx * dx + dy * dy <= rsum * rsum;
    }

    return { step: step, vec: vec };
  })();

  /* ==================== 图片加载 ==================== */
  var photos = [];          // 每级一张离屏画布
  var photosOk = 0;
  var diagLines = [];

  for (var li = 0; li < LEVELS.length; li++) {
    (function (idx) {
      var im = new Image();
      var settled = false;
      function settle(ok, note) {
        if (settled) return;
        settled = true;
        if (!ok) photos[idx] = null;
        diagLines.push('L' + (idx + 1) + ' ' + note);
        if (diagLines.length >= LEVELS.length) refreshDiag();
        draw();
      }
      im.onload = function () {
        try {
          var off = document.createElement('canvas');
          off.width = 256; off.height = 256;
          var og = off.getContext('2d');
          og.imageSmoothingEnabled = true;
          og.imageSmoothingQuality = 'high';
          og.drawImage(im, 0, 0, 256, 256);
          photos[idx] = off;
          photosOk++;
          settle(true, 'OK');
        } catch (e) { settle(false, '绘制失败'); }
      };
      im.onerror = function () { settle(false, '加载失败'); };
      setTimeout(function () { settle(false, '超时'); }, 3000);
      im.src = LEVELS[idx].photo;
    })(li);
  }

  function refreshDiag() {
    diagEl.style.display = 'block';
    if (photosOk === LEVELS.length) {
      diagEl.className = 'diag ok';
      diagEl.textContent = '八张照片全部就绪（' + photosOk + '/' + LEVELS.length + '）';
    } else {
      diagEl.className = 'diag bad';
      diagEl.textContent = '只加载了 ' + photosOk + '/' + LEVELS.length + ' 张照片。' +
        (location.protocol === 'file:'
          ? '如果你是双击打开文件的，改用本地服务器试试：在 D:\\自我介绍 下运行 node serve.mjs'
          : '请检查 games/photos/ 里的 tile1.jpg ~ tile8.jpg') +
        '　' + diagLines.join(' | ');
    }
  }

  /* ==================== 游戏状态 ==================== */
  var balls = [];
  var score = 0;
  var best = 0;
  var over = false;
  var pending = null;        // 待投放的球 { level, x }
  var nextLevel = 0;         // 下一个球的级别
  var overFrames = 0;        // 连续越线帧数
  var settleTimer = 0;       // 当前球落地后的稳定计时
  var canDrop = true;
  var lastLevelMade = -1;

  try { best = parseInt(localStorage.getItem('watermelon_best'), 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  // 进度条
  (function buildLevelBar() {
    for (var i = 0; i < LEVELS.length; i++) {
      var d = document.createElement('div');
      var bar = document.createElement('i');
      bar.style.background = COLORS[i];
      d.appendChild(bar);
      levelsEl.appendChild(d);
    }
  })();
  function markProgress() {
    var kids = levelsEl.children;
    for (var i = 0; i < kids.length; i++) {
      // 已经合出来的级别全亮，还没到过的变暗
      kids[i].firstChild.style.opacity = (i <= lastLevelMade) ? '1' : '.18';
    }
  }

  /* ==================== 投放 ==================== */
  // 前几个球只在最小的三级里随机，避免开局就丢大球
  function pickLevel() {
    var pool = [0, 0, 0, 1, 1, 2];
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function spawnPending() {
    nextLevel = pickLevel();
    pending = {
      level: nextLevel,
      x: pending ? pending.x : W / 2
    };
    pending.x = Math.max(LEVELS[nextLevel].r + 2, Math.min(W - LEVELS[nextLevel].r - 2, pending.x));
    canDrop = true;
  }

  function drop() {
    if (over || !pending || !canDrop) return;
    var lv = pending.level;
    var r = LEVELS[lv].r;
    var x = Math.max(r + 2, Math.min(W - r - 2, pending.x));
    balls.push({
      pos: Phys.vec(x, DROP_Y),
      vel: Phys.vec(0, 1),
      radius: r,
      level: lv,
      maxLevel: MAX_LEVEL,
      dead: false,
      born: performance.now(),
      pop: 1
    });
    canDrop = false;
    settleTimer = 0;
    pending = null;
    draw();
  }

  /* ==================== 合并 ==================== */
  function onMerge(A, B) {
    var newLevel = A.level + 1;
    var mx = (A.pos.x + B.pos.x) / 2;
    var my = (A.pos.y + B.pos.y) / 2;

    if (newLevel >= MAX_LEVEL) {
      // 两个最高级球合并 → 通关
      balls.push({
        pos: Phys.vec(mx, my),
        vel: Phys.vec((A.vel.x + B.vel.x) / 2, (A.vel.y + B.vel.y) / 2),
        radius: LEVELS[MAX_LEVEL - 1].r,
        level: MAX_LEVEL - 1,
        maxLevel: MAX_LEVEL,
        dead: false,
        born: performance.now(),
        pop: 1
      });
      win();
      return true;
    }

    // 半径按新级别来；速度取两球的平均并稍微提速，手感更爽
    var nr = LEVELS[newLevel].r;
    balls.push({
      pos: Phys.vec(mx, my),
      vel: Phys.vec((A.vel.x + B.vel.x) / 2, (A.vel.y + B.vel.y) / 2 - 1.2),
      radius: nr,
      level: newLevel,
      maxLevel: MAX_LEVEL,
      dead: false,
      born: performance.now(),
      pop: 1
    });

    score += (newLevel + 1) * (newLevel + 1);
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('watermelon_best', String(best)); } catch (e) {}
    }
    if (newLevel > lastLevelMade) { lastLevelMade = newLevel; markProgress(); }
    return true;
  }

  /* ==================== 结束 / 通关 ==================== */
  function gameOver() {
    if (over) return;
    over = true;
    ovTitle.textContent = '堆满了';
    ovText.textContent = '这一局拿了 ' + score + ' 分。';
    ovBtn.textContent = '再来一局';
    overlay.classList.add('show');
  }

  function win() {
    if (over) return;
    over = true;
    ovTitle.textContent = '合出思源亭了！';
    ovText.textContent = '八张校园照全部集齐，得分 ' + score + '。';
    ovBtn.textContent = '再来一局';
    overlay.classList.add('show');
  }

  /* ==================== 主循环 ==================== */
  function loop() {
    if (!over) {
      // 物理推进
      Phys.step(balls, {
        left: 0, right: W, bottom: H,
        gravity: GRAVITY, iterations: 5,
        onMerge: onMerge
      });
      balls = balls.filter(function (b) { return !b.dead; });

      // 越线判定：球顶越过 DEAD_LINE 并持续停留
      var anyOver = false;
      for (var i = 0; i < balls.length; i++) {
        var b = balls[i];
        // 刚生成的球给它一点时间落下来，不然一出生就被判越线
        if (performance.now() - b.born < 700) continue;
        if (b.pos.y - b.radius < DEAD_LINE) { anyOver = true; break; }
      }
      overFrames = anyOver ? overFrames + 1 : 0;
      if (overFrames > MAX_OVER_TIME) gameOver();

      // 投放节奏：上一个球稳定下来后，过一小会儿给下一个
      if (!canDrop && !over) {
        settleTimer++;
        if (settleTimer > 34) spawnPending();
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  /* ==================== 渲染 ==================== */
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 底部与顶部的渐变底，让球堆有依托感
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, 'rgba(99,102,241,.05)');
    bg.addColorStop(1, 'rgba(244,114,182,.05)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 危险线
    ctx.save();
    ctx.setLineDash([8, 8]);
    ctx.strokeStyle = overFrames > 20 ? 'rgba(244,114,182,.75)' : 'rgba(255,255,255,.12)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, DEAD_LINE);
    ctx.lineTo(W, DEAD_LINE);
    ctx.stroke();
    ctx.restore();

    // 已投放的球
    for (var i = 0; i < balls.length; i++) {
      drawBall(balls[i], false);
    }

    // 待投放的球（跟着鼠标/手指左右移动）
    if (pending && !over) {
      // 从球心到地面的虚线，帮助瞄准
      ctx.save();
      ctx.setLineDash([5, 9]);
      ctx.strokeStyle = 'rgba(255,255,255,.16)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pending.x, DROP_Y + LEVELS[pending.level].r);
      ctx.lineTo(pending.x, H);
      ctx.stroke();
      ctx.restore();
      drawBall({
        pos: Phys.vec(pending.x, DROP_Y),
        radius: LEVELS[pending.level].r,
        level: pending.level,
        pop: 1, born: performance.now()
      }, true);
    }
  }

  function drawBall(b, isPending) {
    var cx = b.pos.x, cy = b.pos.y;
    var r = b.radius;
    var col = COLORS[b.level] || '#6366f1';

    // 新球弹出效果：0.18 秒内从 1.25 倍缩到 1 倍
    var age = performance.now() - (b.born || 0);
    var scale = 1;
    if (age < 180) {
      var t = age / 180;
      scale = 1 + 0.25 * (1 - t) * (1 - t);
    }
    var rr = r * scale;

    // 外发光
    ctx.save();
    ctx.shadowColor = col;
    ctx.shadowBlur = isPending ? 22 : 12;
    ctx.beginPath();
    ctx.arc(cx, cy, rr, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
    ctx.restore();

    // 照片：裁成圆形画进去
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, rr, 0, Math.PI * 2);
    ctx.clip();
    var off = photos[b.level];
    if (off) {
      ctx.drawImage(off, cx - rr, cy - rr, rr * 2, rr * 2);
      ctx.fillStyle = 'rgba(255,255,255,.08)';   // 深色主题下提亮一点
      ctx.fillRect(cx - rr, cy - rr, rr * 2, rr * 2);
    } else {
      var g = ctx.createRadialGradient(cx - rr * .3, cy - rr * .3, rr * .1, cx, cy, rr);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(1, col);
      ctx.fillStyle = g;
      ctx.fillRect(cx - rr, cy - rr, rr * 2, rr * 2);
    }
    ctx.restore();

    // 外圈描边，让球在深色背景上有边界
    ctx.strokeStyle = 'rgba(255,255,255,.45)';
    ctx.lineWidth = Math.max(1.5, rr * 0.035);
    ctx.beginPath();
    ctx.arc(cx, cy, rr - 0.8, 0, Math.PI * 2);
    ctx.stroke();

    // 注意：球上不再画级别数字，只靠照片本身区分。
    // 所以外圈描边就成了唯一的边界提示，这里保持不透明。
  }

  /* ==================== 交互 ==================== */
  function toCanvasX(clientX) {
    var rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) / rect.width * W;
  }

  function moveAim(clientX) {
    if (!pending || over) return;
    var r = LEVELS[pending.level].r;
    pending.x = Math.max(r + 2, Math.min(W - r - 2, toCanvasX(clientX)));
    draw();
  }

  canvas.addEventListener('mousemove', function (e) { moveAim(e.clientX); });
  canvas.addEventListener('touchmove', function (e) {
    moveAim(e.changedTouches[0].clientX);
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('click', function (e) {
    moveAim(e.clientX);
    drop();
  });
  canvas.addEventListener('touchend', function (e) {
    moveAim(e.changedTouches[0].clientX);
    drop();
    e.preventDefault();
  }, { passive: false });

  // 空格/回车也能投放
  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); drop(); }
  });

  document.getElementById('restart').addEventListener('click', newGame);
  ovBtn.addEventListener('click', newGame);

  /* ==================== 开局 ==================== */
  function newGame() {
    balls = [];
    score = 0;
    over = false;
    overFrames = 0;
    settleTimer = 0;
    canDrop = true;
    lastLevelMade = -1;
    pending = null;
    scoreEl.textContent = '0';
    overlay.classList.remove('show');
    markProgress();
    spawnPending();
    draw();
  }

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
