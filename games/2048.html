<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>2048 · 孙路遥的小游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />
<style>
:root {
  --brand-1: #6366f1;
  --brand-2: #22d3ee;
  --brand-3: #f472b6;
  --bg: #070711;
  --surface: rgba(255,255,255,.045);
  --surface-2: rgba(255,255,255,.075);
  --border: rgba(255,255,255,.10);
  --text: #f2f3fa;
  --text-dim: #a8acc6;
  --text-faint: #6f7391;
  --radius: 20px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --font-cn: "Noto Sans SC", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
  --font-en: "Outfit", var(--font-cn);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-cn);
  background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.7;
  overflow-x: hidden;
  display: flex; flex-direction: column; align-items: center;
  padding: 0 20px;
  -webkit-tap-highlight-color: transparent;
}
.blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .45; z-index: -1; pointer-events: none; }
.b1 { width: 44vw; height: 44vw; background: var(--brand-1); top: -16vw; left: -12vw; }
.b2 { width: 34vw; height: 34vw; background: var(--brand-2); bottom: -16vw; right: -10vw; }

.wrap { width: 100%; max-width: 560px; margin: 0 auto; }
.back { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; color: var(--text-dim); text-decoration: none; padding: 24px 0 8px; }
.back:hover { color: var(--text); }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 12px 0 22px; }
h1 { font-size: clamp(30px, 7vw, 42px); font-weight: 900; letter-spacing: -.03em; line-height: 1.1; }
.grad {
  background: linear-gradient(100deg, var(--brand-1), var(--brand-2) 50%, var(--brand-3));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.scores { display: flex; gap: 10px; flex: none; }
.score {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 8px 18px; text-align: center; min-width: 84px;
}
.score b { display: block; font-family: var(--font-en); font-size: 21px; font-weight: 800; line-height: 1.2; }
.score span { font-size: 11.5px; color: var(--text-faint); letter-spacing: .06em; }

.board-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; }
canvas {
  width: 100%; height: 100%; display: block;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: rgba(255,255,255,.03);
  touch-action: none;
}

.hint { text-align: center; color: var(--text-faint); font-size: 13.5px; padding: 16px 0 4px; }

/* 照片加载诊断面板：只在出问题时显示 */
.diag {
  display: none; margin: 10px 0 0; padding: 12px 16px;
  border-radius: 12px; font-size: 13px; line-height: 1.65;
  border: 1px solid;
}
.diag.ok { border-color: rgba(34,211,238,.35); background: rgba(34,211,238,.08); color: var(--brand-2); }
.diag.bad { border-color: rgba(244,114,182,.45); background: rgba(244,114,182,.10); color: #ffd9ec; }
.diag-list { color: var(--text-faint); font-size: 12px; }
.tools { display: flex; justify-content: center; gap: 12px; padding: 14px 0 8px; }
button {
  font-family: inherit; font-size: 14.5px; font-weight: 600;
  color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 100px;
  padding: 10px 24px; cursor: pointer;
  transition: transform .2s var(--ease), background .2s, border-color .2s;
}
button:hover { transform: translateY(-2px); background: var(--surface-2); border-color: rgba(255,255,255,.24); }
button:active { transform: translateY(0); }

.overlay {
  position: absolute; inset: 0; border-radius: var(--radius);
  background: rgba(7,7,17,.86);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: grid; place-items: center; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .35s var(--ease);
}
.overlay.show { opacity: 1; pointer-events: auto; }
.overlay-inner { padding: 24px; }
.overlay h2 { font-size: clamp(26px, 6vw, 34px); font-weight: 900; margin-bottom: 8px; }
.overlay p { color: var(--text-dim); font-size: 14.5px; margin-bottom: 20px; }
.overlay button { background: linear-gradient(120deg, var(--brand-1), var(--brand-2)); border: none; color: #fff; }

footer { margin-top: auto; padding: 34px 0; font-size: 13px; color: var(--text-faint); }

@media (max-width: 460px) {
  .head { flex-direction: column; align-items: flex-start; }
  .score { padding: 6px 14px; min-width: 74px; }
}
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="wrap">
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    返回小游戏合集
  </a>

  <div class="head">
    <h1><span class="grad">2048</span></h1>
    <div class="scores">
      <div class="score"><b id="score">0</b><span>得分</span></div>
      <div class="score"><b id="best">0</b><span>最高分</span></div>
    </div>
  </div>

  <div class="board-wrap">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-inner">
        <h2 id="ovTitle">游戏结束</h2>
        <p id="ovText">再来一局试试？</p>
        <button id="ovBtn">重新开始</button>
      </div>
    </div>
  </div>

  <div class="hint">方向键 ↑ ↓ ← → 移动，手机上手势滑动</div>
  <div class="diag" id="diag"></div>
  <div class="tools">
    <button id="restart">重新开始</button>
  </div>
</div>

<footer class="wrap">单个 HTML 文件实现，没有依赖库。</footer>

<script>
(function () {
  'use strict';

  /* ============================================================
     2048 —— 实现思路（读这段就能讲清楚这个游戏怎么做的）
     ------------------------------------------------------------
     ① 数据层：用长度 N*N 的一维数组表示棋盘，null 表示空格。
        用一个数组而不是二维数组，后面「压缩 / 合并」写起来短很多。
        改 N 的值就能换棋盘大小（4 → 4x4，5 → 5x5），其他代码不用动。
     ② 每个方块有一个唯一编号 id，值和 id 分开记。
        为什么要 id？因为动画要准确知道「哪一块滑到了哪里」，
        只看数值的话，两个 2 会互相认错，动画就会乱飞。
     ③ 移动：四个方向都统一转成「向左滑」处理，再把结果转回来。
        所以整套移动算法只写了一遍，而不是四遍。
     ④ 向左滑 = 三步：压紧去掉空格 → 相邻相等就翻倍 → 补零到 N 格。
     ⑤ 渲染：Canvas 每帧重画，位置用缓动函数插值，于是有了滑动感。
     ============================================================ */

  var N = 5;                      // 棋盘边长：4 = 4x4，5 = 5x5（改这里，其余全自动适配）
  var SIZE = 600;                 // 画布内部分辨率，会被 CSS 缩放到实际大小
  var PAD = 14;                   // 棋盘四周留白
  var GAP = 14;                   // 格子间距
  var RAD = 14;                   // 圆角半径
  var CELL = (SIZE - PAD * 2 - GAP * (N - 1)) / N;

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovBtn = document.getElementById('ovBtn');

  // 高分屏适配：按设备像素比放大画布，否则文字会发虚
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = SIZE * dpr;
  canvas.height = SIZE * dpr;
  ctx.scale(dpr, dpr);

  // 数值 → 配色。只在照片还没加载完时代替显示，平时看不到。
  var COLORS = {
    2:    ['#2a2f4a', '#e8eaf6'],
    4:    ['#333a63', '#e8eaf6'],
    8:    ['#4f46e5', '#ffffff'],
    16:   ['#6366f1', '#ffffff'],
    32:   ['#0ea5e9', '#ffffff'],
    64:   ['#22d3ee', '#062a33'],
    128:  ['#10b981', '#04231a'],
    256:  ['#a3e635', '#1a2b06'],
    512:  ['#f59e0b', '#2b1c04'],
    1024: ['#f472b6', '#2b0620'],
    2048: ['#ef4444', '#2b0606']
  };

  /* ---------- 照片方块 ----------
     8 张海南大学校园照轮流贴在方块上。数字不消失，
     而是缩小成左上角的一个小标牌 —— 照片才是主角。
     照片放在同目录的 photos/ 文件夹里，命名 tile1.jpg ~ tile8.jpg。 */
  var PHOTO_COUNT = 8;

  var photoDiag = [];        // 每张图的加载结果，出问题时显示在页面上
  var photos = [];
  var photosDone = false;    // 8 张全部「有结果」后置为 true（成功或失败都算）

  for (var pi = 0; pi < PHOTO_COUNT; pi++) {
    (function (idx) {
      var im = new Image();
      // 关键：每个编号只允许被结算一次。
      // 否则「已加载」和「超时兜底」可能都触发，诊断信息会自相矛盾。
      var settled = false;

      function settle(ok, note) {
        if (settled) return;
        settled = true;
        if (!ok) photos[idx] = null;
        photoDiag.push('tile' + (idx + 1) + ': ' + note);
        if (photoDiag.length >= PHOTO_COUNT) photosDone = true;
        refreshDiag();
        // 关键：照片是异步加载的，可能晚于开局的第一次绘制。
        // 不主动重绘的话，开局那两个方块会一直是纯色底，
        // 非要等玩家按一次方向键才会显示照片。
        requestAnimationFrame(render);
      }

      im.onload = function () {
        var w = im.naturalWidth || im.width;
        var h = im.naturalHeight || im.height;
        try {
          // 预缩放到 320x320 的离屏画布，原图 1280px 每帧直接缩放太慢
          var off = document.createElement('canvas');
          off.width = 320; off.height = 320;
          var og = off.getContext('2d');
          og.imageSmoothingEnabled = true;
          og.imageSmoothingQuality = 'high';
          og.drawImage(im, 0, 0, 320, 320);
          photos[idx] = off;
          settle(true, 'OK ' + w + 'x' + h);
        } catch (err) {
          settle(false, '画布绘制失败 ' + err.message);
        }
      };

      im.onerror = function () {
        settle(false, '加载失败（文件不存在或路径不对）');
      };

      // 兜底：3 秒还没结果就当成失败，否则页面会一直沉默不语
      setTimeout(function () {
        settle(false, '超时未响应（很可能是浏览器拦了本地图片）');
      }, 3000);

      im.src = 'photos/tile' + (idx + 1) + '.jpg';
    })(pi);
  }

  // 把诊断结果显示到页面上，这样出问题时一眼能看到，不用开控制台
  function refreshDiag() {
    var el = document.getElementById('diag');
    if (!el) return;
    var ok = photos.filter(function (p) { return p; }).length;
    el.style.display = 'block';
    el.textContent = '';                       // 先清空，避免残留上一次的文字
    if (ok === PHOTO_COUNT) {
      el.className = 'diag ok';
      el.textContent = '照片已全部加载（' + ok + '/' + PHOTO_COUNT + '）';
    } else {
      el.className = 'diag bad';
      var tip = (location.protocol === 'file:')
        ? '<b>你现在是双击打开文件的（file://），浏览器拦住了本地图片。</b><br>请在 D:\\自我介绍 目录下运行 <b>node serve.mjs</b>，然后访问 http://127.0.0.1:5173/games/2048.html'
        : '请检查 games/photos/ 里的 tile1.jpg ~ tile8.jpg 是否齐全。';
      el.innerHTML = '照片只加载了 <b>' + ok + '/' + PHOTO_COUNT + '</b> 张。' + tip +
        '<br><span class="diag-list">' + photoDiag.join('　|　') + '</span>';
    }
  }

  // 数值 → 用第几张照片：2→第1张，4→第2张 …… 8 张轮完再从第 1 张继续
  function photoFor(v) {
    var step = Math.round(Math.log(v) / Math.LN2) - 1;   // 2→0, 4→1, 8→2 …
    return ((step % PHOTO_COUNT) + PHOTO_COUNT) % PHOTO_COUNT;
  }

  var grid = [];          // 当前棋盘：每格是 { id, value } 或 null
  var score = 0;
  var best = 0;
  var over = false;
  var won = false;
  var nextId = 1;         // 方块编号发号器
  var maxTile = 0;
  var animStart = 0;      // 当前滑动动画的起始时间戳
  var ANIM = 130;         // 滑动动画时长（毫秒）
  var events = [];        // 本次移动产生的动画事件
  var busy = false;       // 动画播放中，暂时不接受新操作

  try { best = parseInt(localStorage.getItem('game2048best'), 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  /* ---------- 数据层辅助 ---------- */

  function newTile(v) { return { id: nextId++, value: v }; }

  function emptyCells() {
    var out = [];
    for (var i = 0; i < N * N; i++) if (!grid[i]) out.push(i);
    return out;
  }

  // 在随机空格生成新数字：九成是 2，一成是 4
  function addRandom() {
    var cells = emptyCells();
    if (!cells.length) return;
    var idx = cells[Math.floor(Math.random() * cells.length)];
    grid[idx] = newTile(Math.random() < 0.9 ? 2 : 4);
    events.push({ type: 'spawn', id: grid[idx].id, at: idx });
  }

  /* ---------- 核心：一行的向左滑动 ----------
     输入 [2,0,2,4] → 压紧 [2,2,4] → 合并 [4,4] → 补零 [4,4,0,0]
     返回值：
       line    移动后的四个格子
       gained  本次合并拿到的分数
       moved   这一行是否真的动了（只要动了就要生成新方块）           */
  function slideLine(line) {
    var tiles = line.filter(function (t) { return t !== null; });
    var out = [];
    var gained = 0;
    var moved = false;
    var i = 0;

    while (i < tiles.length) {
      var cur = tiles[i];
      var nxt = tiles[i + 1];

      if (nxt && nxt.value === cur.value) {
        // 相邻同值 → 合并：保留左边那块的编号，值翻倍
        var merged = { id: cur.id, value: cur.value * 2, mergedFrom: nxt.id };
        out.push(merged);
        gained += merged.value;
        if (merged.value > maxTile) maxTile = merged.value;
        i += 2;
      } else {
        out.push(cur);
        i += 1;
      }
    }

    while (out.length < N) out.push(null);

    // 判断有没有变化：任何一块换了位置或发生了合并，都算动了
    for (var k = 0; k < N; k++) {
      var a = line[k], b = out[k];
      if (a !== b) { moved = true; break; }
    }
    return { line: out, gained: gained, moved: moved };
  }

  /* ---------- 旋转 ----------
     把棋盘顺时针转 90 度，「向右 / 向上 / 向下」都能复用 slideLine，
     于是四个方向共享同一套移动逻辑。                                    */
  function rotateCW(g) {
    var out = new Array(N * N);
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        out[c * N + (N - 1 - r)] = g[r * N + c];
      }
    }
    return out;
  }

  /* ---------- 移动 ----------
     dir: 0 左  1 上  2 右  3 下
     方向 → 旋转次数：左 0 次、上 3 次、右 2 次、下 1 次                     */
  function move(dir) {
    if (over || busy) return;

    var work = grid.slice();
    var turns = (4 - dir) % 4;
    for (var t = 0; t < turns; t++) work = rotateCW(work);

    var gained = 0;
    var moved = false;
    events = [];

    for (var r = 0; r < N; r++) {
      var line = work.slice(r * N, r * N + N);
      var res = slideLine(line);
      if (res.moved) moved = true;
      gained += res.gained;
      for (var c = 0; c < N; c++) work[r * N + c] = res.line[c];
    }

    if (!moved) { events = []; return; }   // 这个方向动不了，不生成新数字

    // 转回来
    var back = (4 - turns) % 4;
    for (var t2 = 0; t2 < back; t2++) work = rotateCW(work);

    grid = work;
    score += gained;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('game2048best', String(best)); } catch (e) {}
    }

    addRandom();

    // 启动动画：这段时间内不接受新操作，避免动画错乱
    animStart = performance.now();
    busy = true;
    setTimeout(function () {
      busy = false;
      events = [];
      checkState();
    }, ANIM + 10);

    requestAnimationFrame(render);
  }

  function canMove() {
    if (emptyCells().length) return true;
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var v = grid[r * N + c].value;
        if (c + 1 < N && grid[r * N + c + 1].value === v) return true;
        if (r + 1 < N && grid[(r + 1) * N + c].value === v) return true;
      }
    }
    return false;
  }

  function checkState() {
    if (!won && maxTile >= 2048) {
      won = true;
      showOverlay('达成 2048！', '还能继续往上合，要不要接着玩？', '继续玩', function () {
        hideOverlay();
        setTimeout(function () { if (!canMove()) endGame(); }, 120);
      });
      return;
    }
    if (!canMove()) endGame();
  }

  function endGame() {
    over = true;
    showOverlay(
      '游戏结束',
      '这一局拿了 ' + score + ' 分' + (score >= best && score > 0 ? '，是新纪录！' : '。'),
      '再玩一局',
      newGame
    );
  }

  function showOverlay(title, text, btn, fn) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btn;
    ovBtn.onclick = fn;
    overlay.classList.add('show');
  }
  function hideOverlay() { overlay.classList.remove('show'); }

  /* ---------- 渲染 ---------- */

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function pos(row, col) {
    return [PAD + col * (CELL + GAP), PAD + row * (CELL + GAP)];
  }

  function ease(t) { return 1 - Math.pow(1 - t, 3); }   // easeOutCubic

  // 把十六进制颜色整体提亮 / 压暗，用来做渐变
  function shade(hex, percent) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    var f = percent / 100;
    r = Math.max(0, Math.min(255, Math.round(r + 255 * f)));
    g = Math.max(0, Math.min(255, Math.round(g + 255 * f)));
    b = Math.max(0, Math.min(255, Math.round(b + 255 * f)));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  /* 画一个方块：
     底 = 照片（按短边铺满、居中裁切，也就是 CSS 的 object-fit: cover）
     角 = 左上角小标牌，写着数字
     照片没加载完时自动退回纯色底，不会白屏                        */
  function drawTile(x, y, size, v, alpha) {
    var col = COLORS[v] || ['#1a1a2e', '#ffffff'];
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;

    // ① 底色（照片的半透明或未加载时都能看到，不会露出画布）
    var g = ctx.createLinearGradient(x, y, x + size, y + size);
    g.addColorStop(0, col[0]);
    g.addColorStop(1, shade(col[0], -20));
    ctx.fillStyle = g;
    roundRect(x, y, size, size, RAD);
    ctx.fill();

    // ② 照片：裁成圆形区域后按 cover 方式铺满
    var off = photos[photoFor(v)];
    if (off && v) {
      ctx.save();
      roundRect(x, y, size, size, RAD);
      ctx.clip();
      var s = Math.max(size / off.width, size / off.height);   // cover 的缩放比
      var dw = off.width * s;
      var dh = off.height * s;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(off, x + (size - dw) / 2, y + (size - dh) / 2, dw, dh);
      // 整体提亮一点：校园照本身偏深，直接在深色页面上会显得发黑
      ctx.fillStyle = 'rgba(255,255,255,.10)';
      ctx.fillRect(x, y, size, size);
      // 顶部再压一层很淡的暗角，只为了让数字标牌在亮照片上读得清
      var vg = ctx.createLinearGradient(x, y, x, y + size * 0.36);
      vg.addColorStop(0, 'rgba(0,0,0,.42)');
      vg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = vg;
      ctx.fillRect(x, y, size, size * 0.36);
      ctx.restore();
    }

    // ③ 左上角数字标牌
    if (v) {
      var dg = String(v).length;
      var fpx = Math.max(9, Math.round(size * (dg <= 2 ? 0.26 : dg === 3 ? 0.21 : dg === 4 ? 0.17 : 0.14)));
      ctx.font = '800 ' + fpx + 'px Outfit, system-ui, sans-serif';
      var tw = ctx.measureText(String(v)).width;
      var padX = Math.round(fpx * 0.30);
      var padY = Math.round(fpx * 0.20);
      var bw = tw + padX * 2;
      var bh = fpx + padY * 2;
      var bx = x + Math.round(size * 0.055);
      var by = y + Math.round(size * 0.055);

      ctx.fillStyle = 'rgba(8,10,22,.74)';
      roundRect(bx, by, bw, bh, Math.min(bh / 2, 14));
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.22)';
      ctx.lineWidth = 1;
      roundRect(bx + .5, by + .5, bw - 1, bh - 1, Math.min(bh / 2, 14));
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(v), bx + bw / 2, by + bh / 2 + fpx * 0.04);
    }

    ctx.globalAlpha = 1;
  }

  function render(now) {
    ctx.clearRect(0, 0, SIZE, SIZE);

    // ① 先画 N*N 个空底座
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var p = pos(r, c);
        ctx.fillStyle = 'rgba(255,255,255,.035)';
        roundRect(p[0], p[1], CELL, CELL, RAD);
        ctx.fill();
      }
    }

    // ② 动画进度：0 表示刚开始，1 表示结束
    var t = 1;
    if (animStart) {
      t = Math.min((now - animStart) / ANIM, 1);
      if (t >= 1) animStart = 0;
    }
    var et = ease(t);

    // 按 id 建表，方便查「这一块上一帧在哪」
    var byId = {};
    for (var i = 0; i < N * N; i++) {
      if (grid[i]) byId[grid[i].id] = { at: i, tile: grid[i] };
    }

    // ③ 普通方块：从旧位置滑到新位置（新生成的从 0.6 倍缩放淡入）
    for (var id in byId) {
      var info = byId[id];
      var r3 = Math.floor(info.at / N), c3 = info.at % N;
      var to = pos(r3, c3);
      var ev = null;
      for (var k = 0; k < events.length; k++) {
        if (events[k].type === 'move' && events[k].id === Number(id)) { ev = events[k]; break; }
      }

      if (animStart && ev) {
        var fp = pos(Math.floor(ev.from / N), ev.from % N);
        drawTile(
          fp[0] + (to[0] - fp[0]) * et,
          fp[1] + (to[1] - fp[1]) * et,
          CELL, info.tile.value, 1
        );
      } else if (animStart && !ev) {
        var s = CELL * (0.6 + 0.4 * et);
        drawTile(to[0] + (CELL - s) / 2, to[1] + (CELL - s) / 2, s, info.tile.value, et);
      } else {
        drawTile(to[0], to[1], CELL, info.tile.value, 1);
      }
    }

    // ④ 合并产生的方块：画在新位置上，带一个「弹出」的缩放
    for (var m = 0; m < events.length; m++) {
      if (events[m].type !== 'merge') continue;
      var dest = events[m].at;
      var tt = pos(Math.floor(dest / N), dest % N);
      var scale = animStart ? 1 + 0.14 * Math.sin(Math.PI * t) : 1;
      var sz = CELL * scale;
      drawTile(tt[0] + (CELL - sz) / 2, tt[1] + (CELL - sz) / 2, sz, events[m].value, 1);
    }

    if (!over && (animStart || busy || !photosDone)) requestAnimationFrame(render);
  }

  /* ---------- 交互 ---------- */

  var KEYMAP = {
    ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3,
    a: 0, w: 1, d: 2, s: 3, A: 0, W: 1, D: 2, S: 3
  };

  window.addEventListener('keydown', function (e) {
    var dir = KEYMAP[e.key];
    if (dir === undefined) return;
    e.preventDefault();
    move(dir);
  });

  // 触屏 / 鼠标拖拽：位移超过 30px 算一次滑动
  var startX = 0, startY = 0, tracking = false;

  function onDown(x, y) { startX = x; startY = y; tracking = true; }
  function onUp(x, y) {
    if (!tracking) return;
    tracking = false;
    var dx = x - startX, dy = y - startY;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 30) return;
    move(ax > ay ? (dx > 0 ? 2 : 0) : (dy > 0 ? 3 : 1));
  }

  canvas.addEventListener('touchstart', function (e) {
    var t0 = e.changedTouches[0];
    onDown(t0.clientX, t0.clientY);
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', function (e) {
    var t1 = e.changedTouches[0];
    onUp(t1.clientX, t1.clientY);
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('mousedown', function (e) { onDown(e.clientX, e.clientY); });
  window.addEventListener('mouseup', function (e) { onUp(e.clientX, e.clientY); });

  document.getElementById('restart').addEventListener('click', newGame);

  /* ---------- 开局 ---------- */

  function newGame() {
    hideOverlay();
    grid = new Array(N * N);
    for (var i = 0; i < N * N; i++) grid[i] = null;
    score = 0;
    over = false;
    won = false;
    maxTile = 0;
    animStart = 0;
    busy = false;
    events = [];
    scoreEl.textContent = '0';
    addRandom();
    addRandom();
    requestAnimationFrame(render);
  }

  // 首次进入：如果浏览器开了「减少动态效果」，就把动画时长压到最短
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    ANIM = 1;
  }

  newGame();
})();

</script>
</body>
</html>
